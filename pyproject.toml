[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apksigcopier"
dynamic = ["version"]
description = "copy/extract/patch android apk signatures & compare apks"
readme = "README.md"
license = { text = "GPLv3+" }
requires-python = ">=3.7"
authors = [
  { name = "FC Stegerman", email = "flx@obfusk.net" },
]
keywords = ["android", "apk", "reproducible", "signing", "compare"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Telecommunications Industry",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Operating System :: POSIX",
  "Operating System :: Unix",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.7",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Topic :: Software Development",
  "Topic :: Utilities",
]
dependencies = ["click>=6.0"]

[project.urls]
Homepage = "https://github.com/obfusk/apksigcopier"

[project.scripts]
apksigcopier = "apksigcopier._cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["apksigcopier*"]

[tool.setuptools.package-data]
apksigcopier = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "apksigcopier._version.__version__" }
